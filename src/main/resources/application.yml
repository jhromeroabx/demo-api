spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update   # solo para desarrollo, en prod mejor 'validate' o scripts propios
    show-sql: true
    properties:
      hibernate:
        format_sql: true